<!doctype html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0a1c" />
    <script>
      // тема до первой отрисовки, без вспышки: выбранная пользователем или Aurora
      try {
        var s = JSON.parse(localStorage.getItem('steno.settings.v1') || '{}')
        if (s.themeChosen && s.theme) document.documentElement.dataset.theme = s.theme
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050810'/%3E%3Crect x='6' y='12' width='3' height='8' rx='1.5' fill='%2322d3ee'/%3E%3Crect x='11' y='8' width='3' height='16' rx='1.5' fill='%2322d3ee'/%3E%3Crect x='16' y='11' width='3' height='10' rx='1.5' fill='%2334d399'/%3E%3Crect x='21' y='14' width='3' height='4' rx='1.5' fill='%2322d3ee'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Transcribe audio and video to text. Runs locally in the browser with Whisper (files never leave your device) or through OpenAI, Groq, Deepgram and any OpenAI-compatible API. Speaker labels, subtitles, AI summaries."
    />
    <title>STENO — speech to text in your browser: local Whisper and cloud</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="STENO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STENO" />
    <meta property="og:title" content="STENO — speech to text in your browser" />
    <meta
      property="og:description"
      content="Local Whisper in the browser or cloud engines. Speaker labels, subtitles, AI summaries. Your files stay on your device."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="STENO — speech to text in your browser" />
    <meta
      name="twitter:description"
      content="Local Whisper in the browser or cloud engines. Speaker labels, subtitles, AI summaries."
    />
    <link rel="dns-prefetch" href="https://huggingface.co" />
    <!-- canonical, hreflang, og:url, JSON-LD: добавляются при сборке плагином stenoSeo (SITE_URL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>STENO — speech to text in your browser</h1>
      <p>
        Transcribe audio and video locally with Whisper (files never leave your device) or through
        OpenAI, Groq, Deepgram and any OpenAI-compatible API. Speaker labels, SRT/VTT subtitles and AI
        summaries. JavaScript is required.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
